services:

  # ── FastAPI backend ──────────────────────────────────────────────────────────
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      AVATAR_PROVIDER: "wav2lip"
      AVATAR_SERVICE_URL: "http://avatar:8080"
      VIDEOS_DIR: "/app/videos"
      DATABASE_URL: "sqlite+aiosqlite:////app/data/grillme.db"
    volumes:
      - db_data:/app/data
      - avatar_videos:/app/videos
    depends_on:
      - avatar

  # ── Vite / React frontend (nginx) ────────────────────────────────────────────
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  # ── Wav2Lip avatar microservice ──────────────────────────────────────────────
  # Before building: run ./download_models.sh to populate ./models/
  # docker compose build then bakes the models into the image (no runtime mount).
  avatar:
    build:
      context: .
      dockerfile: avatar-service/Dockerfile
    ports:
      - "8080:8080"
    environment:
      FACE_IMAGE: "/app/face.jpg"

volumes:
  db_data:
  avatar_videos:
