server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SharedArrayBuffer (required by @ricky0123/vad-web ONNX runtime)
    add_header Cross-Origin-Opener-Policy "same-origin";
    add_header Cross-Origin-Embedder-Policy "credentialless";

    # Ensure .mjs files are served as JavaScript modules (nginx:alpine omits this)
    types {
        application/javascript  js mjs;
        application/wasm        wasm;
        text/css                css;
        text/html               html htm;
        image/png               png;
        image/jpeg              jpg jpeg;
        image/svg+xml           svg;
        application/json        json;
        font/woff2              woff2;
        font/woff               woff;
    }

    # React Router — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy all /api requests to the backend service
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Required for SSE streaming (interview chat)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        # Required for WebSocket upgrade (STT)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
